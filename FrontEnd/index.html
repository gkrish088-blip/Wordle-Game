<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle-2.0</title>
    <script src="https://kit.fontawesome.com/8e34b61e55.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <nav>
        <div class="nav1">
            <i class="fa-solid fa-bars" style="color: rgb(255, 255, 255);"></i>
        </div>
        <div class="spaceInNav"></div>
        <div class="nav2">
            <i class="fa fa-cog" style="color: rgb(255, 255, 255) ; padding-right: 5%;"></i>
            <i class="fa-solid fa-lightbulb" style="color: rgb(255, 255, 255); padding-right: 5%;"></i>
            <i class="fa-solid fa-chart-simple" style="color: rgb(255, 255, 255); padding-right: 5%;"></i>
            <i class="fa-solid fa-circle-question" style="color: rgb(255, 255, 255); padding-left: 3%;"></i>
        </div>
    </nav>
    <div class="play-area">
        <div class="gr">
            <div class="a1 box"></div>
            <div class="a2 box"></div>
            <div class="a3 box"></div>
            <div class="a4 box"></div>
            <div class="a5 box"></div>
            <div class="a6 box"></div>
            <div class="b1 box"></div>
            <div class="b2 box"></div>
            <div class="b3 box"></div>
            <div class="b4 box"></div>
            <div class="b5 box"></div>
            <div class="b6 box"></div>
            <div class="c1 box"></div>
            <div class="c2 box"></div>
            <div class="c3 box"></div>
            <div class="c4 box"></div>
            <div class="c5 box"></div>
            <div class="c6 box"></div>
            <div class="d1 box"></div>
            <div class="d2 box"></div>
            <div class="d3 box"></div>
            <div class="d4 box"></div>
            <div class="d5 box"></div>
            <div class="d6 box"></div>
            <div class="e1 box"></div>
            <div class="e2 box"></div>
            <div class="e3 box"></div>
            <div class="e4 box"></div>
            <div class="e5 box"></div>
            <div class="e6 box"></div>
        </div>
        <div class="keyboard">
            <div class="qwerty">
                <div class="Q alpha"><i class="fa-solid fa-q" style="color: rgb(255, 255, 255);"></i></div>
                <div class="W alpha"><i class="fa-solid fa-w" style="color: rgb(255, 255, 255);"></i></div>
                <div class="E alpha"><i class="fa-solid fa-e" style="color: rgb(255, 255, 255);"></i></div>
                <div class="R alpha"><i class="fa-solid fa-r" style="color: rgb(255, 255, 255);"></i></div>
                <div class="T alpha"><i class="fa-solid fa-t" style="color: rgb(255, 255, 255);"></i></div>
                <div class="Y alpha"><i class="fa-solid fa-y" style="color: rgb(255, 255, 255);"></i></div>
                <div class="U alpha"><i class="fa-solid fa-u" style="color: rgb(255, 255, 255);"></i></div>
                <div class="I alpha"><i class="fa-solid fa-i" style="color: rgb(255, 255, 255);"></i></div>
                <div class="O alpha"><i class="fa-solid fa-o" style="color: rgb(255, 255, 255);"></i></div>
                <div class="P alpha"><i class="fa-solid fa-p" style="color: rgb(255, 255, 255);"></i></div>
            </div>
            <div class="asdf">
                <div class="A alpha"><i class="fa-solid fa-a" style="color: rgb(255, 255, 255);"></i></div>
                <div class="S alpha"><i class="fa-solid fa-s" style="color: rgb(255, 255, 255);"></i></div>
                <div class="D alpha"><i class="fa-solid fa-d" style="color: rgb(255, 255, 255);"></i></div>
                <div class="F alpha"><i class="fa-solid fa-f" style="color: rgb(255, 255, 255);"></i></div>
                <div class="G alpha"><i class="fa-solid fa-g" style="color: rgb(255, 255, 255);"></i></div>
                <div class="H alpha"><i class="fa-solid fa-h" style="color: rgb(255, 255, 255);"></i></div>
                <div class="J alpha"><i class="fa-solid fa-j" style="color: rgb(255, 255, 255);"></i></div>
                <div class="K alpha"><i class="fa-solid fa-k" style="color: rgb(255, 255, 255);"></i></div>
                <div class="L alpha"><i class="fa-solid fa-l" style="color: rgb(255, 255, 255);"></i></div>
            </div>
            <div class="zxcv">
                <div class="enter alpha"><i id="enter">ENTER</i></div>
                <div class="Z alpha"><i class="fa-solid fa-z" style="color: rgb(255, 255, 255);"></i></div>
                <div class="X alpha"><i class="fa-solid fa-x" style="color: rgb(255, 255, 255);"></i></div>
                <div class="C alpha"><i class="fa-solid fa-c" style="color: rgb(255, 255, 255);"></i></div>
                <div class="V alpha"><i class="fa-solid fa-v" style="color: rgb(255, 255, 255);"></i></div>
                <div class="B alpha"><i class="fa-solid fa-b" style="color: rgb(255, 255, 255);"></i></div>
                <div class="N alpha"><i class="fa-solid fa-n" style="color: rgb(255, 255, 255);"></i></div>
                <div class="M alpha"><i class="fa-solid fa-m" style="color: rgb(255, 255, 255);"></i></div>
                <div class="delete alpha"><i class="fa-solid fa-delete-left" style="color: rgb(255, 255, 255); font-size:133%;"></i></div>
            </div>
        </div>
    </div>
    <div class="footer">

    </div>
</body>
</html>
