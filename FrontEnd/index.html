<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordle-2.0</title>
    <script
      src="https://kit.fontawesome.com/8e34b61e55.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <nav>
      <div class="nav1">
        <a href="https://forge-build-week2.vercel.app/" target="_blank">
          <i
            class="fa-solid fa-bars"
            style="color: rgb(255, 255, 255); cursor: pointer"
          >
          </i>
        </a>
      </div>
      <div class="spaceInNav"></div>
      <div class="nav2">
        <i
          class="fa fa-cog"
          style="color: rgb(255, 255, 255); padding-right: 5%"
        ></i>
        <i
          class="fa-solid fa-lightbulb"
          style="color: rgb(255, 255, 255); padding-right: 5%"
        ></i>
        <i
          class="fa-solid fa-chart-simple"
          id="stats-button"
          onclick="toggleStats()"
          style="color: rgb(255, 255, 255); padding-right: 5%; cursor: pointer"
        ></i>
        <i
          class="fa-solid fa-circle-question"
          style="color: rgb(255, 255, 255); padding-left: 3%"
        ></i>
      </div>
      <div class="stats-panel" id="statspanel">
        <h3>
          Your Stats
          <i
            class="fa-solid fa-xmark"
            style="color: rgb(255, 255, 255); cursor: pointer"
            onclick="closeStats()"
          ></i>
        </h3>
        <div class="stat-row">
          <span>Player : </span>
          <span id="statName">-</span>
        </div>
        <div class="stat-row">
          <span>Total Wins : </span>
          <span id="statWins">0</span>
        </div>
        <div class="stat-row">
          <span>Win Streak : </span>
          <span id="statStreak">0</span>
        </div>
      </div>
    </nav>
    <div class="play-area">
      <div class="gr">
        <div class="r1c1 box" id="firstCol"></div>
        <div class="r1c2 box"></div>
        <div class="r1c3 box"></div>
        <div class="r1c4 box"></div>
        <div class="r1c5 box"></div>
        <div class="r1c6 box"></div>
        <div class="r2c1 box"></div>
        <div class="r2c2 box"></div>
        <div class="r2c3 box"></div>
        <div class="r2c4 box"></div>
        <div class="r2c5 box"></div>
        <div class="r2c6 box"></div>
        <div class="r3c1 box"></div>
        <div class="r3c2 box"></div>
        <div class="r3c3 box"></div>
        <div class="r3c4 box"></div>
        <div class="r3c5 box"></div>
        <div class="r3c6 box"></div>
        <div class="r4c1 box"></div>
        <div class="r4c2 box"></div>
        <div class="r4c3 box"></div>
        <div class="r4c4 box"></div>
        <div class="r4c5 box"></div>
        <div class="r4c6 box"></div>
        <div class="r5c1 box"></div>
        <div class="r5c2 box"></div>
        <div class="r5c3 box"></div>
        <div class="r5c4 box"></div>
        <div class="r5c5 box"></div>
        <div class="r5c6 box"></div>
        <div class="message-overlay">
          <div class="message">
            <p>Not in the words list</p>
          </div>
        </div>
      </div>
      <div class="keyboard">
        <div class="qwerty">
          <div
            class="Q alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-q" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="W alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-w" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="E alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-e" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="R alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-r" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="T alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-t" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="Y alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-y" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="U alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-u" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="I alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-i" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="O alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-o" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="P alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-p" style="color: rgb(255, 255, 255)"></i>
          </div>
        </div>
        <div class="asdf">
          <div
            class="A alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-a" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="S alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-s" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="D alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-d" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="F alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-f" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="G alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-g" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="H alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-h" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="J alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-j" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="K alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-k" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="L alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-l" style="color: rgb(255, 255, 255)"></i>
          </div>
        </div>
        <div class="zxcv">
          <div
            class="enter alpha"
            id="enter"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i id="enter">ENTER</i>
          </div>
          <div
            class="Z alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-z" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="X alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-x" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="C alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-c" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="V alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-v" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="B alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-b" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="N alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-n" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="M alpha"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i class="fa-solid fa-m" style="color: rgb(255, 255, 255)"></i>
          </div>
          <div
            class="delete alpha"
            id="delete"
            onclick="onclickKeyboardKey(this)"
            style="cursor: pointer"
          >
            <i
              class="fa-solid fa-delete-left"
              style="color: rgb(255, 255, 255); font-size: 133%"
            ></i>
          </div>
        </div>
      </div>
    </div>
    <div class="footer"></div>
    <div id="win-overlay">
      <div class="win-modal">
        <h2>Congratulations</h2>
        <p>You Guessed the word!!</p>
        <button onclick="closeWinModal()">Close</button>
      </div>
    </div>
    <div class="welcome-overlay">
      <div class="welcome-modal">
        <h2>Welcome to the Wordle</h2>
        <p>
          You get 5 choices to guess a 6 letter word. The word changes everyday
          so be carefull.
        </p>
        <form id="welcome-form">
          <label for="name">Enter Name :- </label>
          <input type="text" name="name" id="name" />
          <input type="submit" value="Submit" />
          <div class="notes-for-form"></div>
        </form>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
